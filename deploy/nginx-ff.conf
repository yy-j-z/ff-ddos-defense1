# /etc/nginx/sites-available/ff
# 把 ff.example.com 替换成你的域名,把白名单 IP 替换成允许访问的客户端 IP

server {
    listen 80;
    server_name ff.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ff.example.com;

    # certbot 会自动填充以下两行
    # ssl_certificate /etc/letsencrypt/live/ff.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ff.example.com/privkey.pem;

    # ─── IP 白名单 ───────────────────────────────
    # 取消注释并改成自己的 IP / CIDR。允许多行 allow。
    # allow 1.2.3.4;
    # allow 5.6.7.0/24;
    # deny all;

    # ─── 限流(防止登录爆破) ─────────────────────
    # 在 http {} 里全局加: limit_req_zone $binary_remote_addr zone=ff_login:10m rate=5r/m;

    client_max_body_size 50m;   # 允许上传 PCAP

    location /api/auth/login {
        # limit_req zone=ff_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 长连接路径,关闭 buffering
    location /api/stream/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
