worker_processes  1;
error_log  /dev/stderr warn;
pid        /tmp/openresty.pid;

events {
    worker_connections  4096;
}

http {
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # Shared dict required by lua-resty-limit-req for the IP sliding window.
    lua_shared_dict ff_limit_req_store 20m;
    lua_shared_dict ff_login_limit_req_store 5m;

    # JSON access log for the proxy layer (forwarded traffic).
    log_format json_proxy escape=json
      '{'
        '"ts":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"ua":"$http_user_agent",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time"'
      '}';

    access_log /dev/stdout json_proxy;

    sendfile        on;
    keepalive_timeout  65;
    default_type application/octet-stream;

    upstream ff_target {
        server target:80;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Lightweight health endpoint (no defense applied).
        location = /defender/health {
            default_type text/plain;
            return 200 'OK';
        }

        location / {
            access_by_lua_file /usr/local/openresty/nginx/lua/rules.lua;

            proxy_pass http://ff_target;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
