worker_processes  1;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # JSON access log to stdout for Verifier consumption.
    log_format json_combined escape=json
      '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"ua":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"xff":"$http_x_forwarded_for"'
      '}';

    access_log /dev/stdout json_combined;

    sendfile        on;
    keepalive_timeout  65;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        server_name _;

        location = / {
            default_type text/html;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><title>FF Target</title></head><body><h1>FF Target App</h1><p>Mock business endpoints: /api/login, /api/products, /health</p></body></html>';
        }

        location = /health {
            default_type text/plain;
            return 200 'OK';
        }

        location = /api/login {
            default_type application/json;
            return 200 '{"token":"mock-jwt-token-abcdef123456","expires_in":3600}';
        }

        location = /api/products {
            default_type application/json;
            return 200 '{"items":[{"id":1,"name":"Widget","price":9.99},{"id":2,"name":"Gadget","price":19.99},{"id":3,"name":"Gizmo","price":29.99}],"total":3}';
        }

        # Catch-all: any path/method returns 200 so that reachability reflects
        # whether the defender lets traffic through (pass=200, blocked=429),
        # not whether the app route exists. Matches DDoS-validation semantics.
        location / {
            default_type application/json;
            return 200 '{"ok":true,"service":"ff-target"}';
        }
    }
}
